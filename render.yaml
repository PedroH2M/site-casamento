services:
  - type: web
    name: wedding-registry
    env: docker
    plan: free
    preDeployCommand: python manage.py migrate
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"

databases:
  - name: wedding-db
    plan: free
